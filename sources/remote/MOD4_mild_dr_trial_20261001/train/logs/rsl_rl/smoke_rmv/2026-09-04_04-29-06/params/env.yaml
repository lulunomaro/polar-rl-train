      body: world
      mode: fixed
      target: null
      type: directional
      castshadow: true
      pos: !!python/tuple
      - 0.0
      - 0.0
      - 1.5
      dir: !!python/tuple
      - 0.0
      - 0.0
      - -1.0
      cutoff: 45.0
      exponent: 10.0
    cameras: !!python/tuple []
    textures: !!python/tuple
    - name: groundplane
      type: 2d
      builtin: checker
      rgb1: !!python/tuple
      - 0.2
      - 0.3
      - 0.4
      rgb2: !!python/tuple
      - 0.1
      - 0.2
      - 0.3
      width: 300
      height: 300
      mark: edge
      markrgb: !!python/tuple
      - 0.8
      - 0.8
      - 0.8
    materials: !!python/tuple
    - name: groundplane
      rgba: !!python/tuple
      - 1.0
      - 1.0
      - 1.0
      - 1.0
      texuniform: true
      texrepeat: !!python/tuple
      - 4.0
      - 4.0
      reflectance: 0.2
      texture: groundplane
      geom_names_expr: !!python/tuple
      - terrain$
    collisions: !!python/tuple []
    terrain_type: plane
    terrain_generator: null
    env_spacing: 2.5
    max_init_terrain_level: null
    num_envs: 64
    debug_vis: false
  entities:
    robot:
      init_state:
        pos: !!python/tuple
        - 0.0
        - 0.0
        - 0.075
        rot: !!python/tuple
        - 1.0
        - 0.0
        - 0.0
        - 0.0
        lin_vel: !!python/tuple
        - 0.0
        - 0.0
        - 0.0
        ang_vel: !!python/tuple
        - 0.0
        - 0.0
        - 0.0
        joint_pos:
          ^(hip|knee)_(L|R)_joint$: 0.0
          ^wheel_(L|R)_joint$: 0.0
        joint_vel:
          .*: 0.0
      spec_fn: !!python/name:rmvehicle.robot_cfg.get_spec ''
      articulation:
        actuators: !!python/tuple
        - target_names_expr: !!python/tuple
          - ^(hip|knee)_(L|R)_joint$
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: null
          frictionloss: null
          viscous_damping: null
          delay_min_lag: 0
          delay_max_lag: 0
          delay_hold_prob: 0.0
          delay_update_period: 0
          delay_per_env_phase: true
          stiffness: 60.0
          damping: 2.0
          effort_limit: 30.0
        - target_names_expr: !!python/tuple
          - ^wheel_(L|R)_joint$
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: null
          frictionloss: null
          viscous_damping: null
          delay_min_lag: 0
          delay_max_lag: 0
          delay_hold_prob: 0.0
          delay_update_period: 0
          delay_per_env_phase: true
          damping: 1.5
          effort_limit: 8.0
        soft_joint_pos_limit_factor: 0.95
      sort_actuators: false
      lights: !!python/tuple []
      cameras: !!python/tuple []
      textures: !!python/tuple []
      materials: !!python/tuple []
      collisions: !!python/tuple
      - geom_names_expr: !!python/tuple
        - .*
        contype: 0
        conaffinity: 1
        condim:
          ^wheel_[LR]_col0$: 6
          .*: 1
        priority:
          ^wheel_[LR]_col0$: 1
        friction:
          ^wheel_[LR]_col0$: !!python/tuple
          - 1.2
          - 0.02
          - 0.002
        solref: null
        solimp: null
        margin: null
        gap: null
        solmix: null
        disable_other_geoms: true
  sensors: !!python/tuple
  - name: wheel_contact
    primary:
      mode: body
      pattern: !!python/tuple
      - wheel_L
      - wheel_R
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: body
      pattern: terrain
      entity: null
      exclude: !!python/tuple []
    fields: !!python/tuple
    - found
    - force
    reduce: maxforce
    num_slots: 1
    secondary_policy: first
    track_air_time: true
    global_frame: false
    history_length: 4
    debug: false
  - name: base_contact
    primary:
      mode: body
      pattern: base
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: body
      pattern: terrain
      entity: null
      exclude: !!python/tuple []
