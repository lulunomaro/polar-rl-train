[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rmvehicle"
version = "0.1.0"
description = "mjlab RL task for the STEP-derived dual wheel-leg robot"
requires-python = ">=3.10"
dependencies = ["mjlab>=1.0.0"]

[project.entry-points."mjlab.tasks"]
rmvehicle = "rmvehicle"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rmvehicle = ["assets/*.xml", "assets/meshes/*.stl"]
